# docker compose up --build  ->  API on http://localhost:8080 (healthz: /healthz)
# PostgreSQL image already contains pgvector for the RAG module.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: homych
      POSTGRES_PASSWORD: homych
      POSTGRES_DB: homych
    ports:
      - "${HOMYCH_DB_PORT:-55432}:5432"   # host port; change with HOMYCH_DB_PORT if it is taken
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homych -d homych"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://homych:homych@db:5432/homych?sslmode=disable
      DEMO_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:-demo-only-secret-change-me}
      APP_TZ: Europe/Moscow
      ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

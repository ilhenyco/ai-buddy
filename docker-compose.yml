# docker compose up --build
#   app (frontend + API through nginx): http://localhost:8088
#   API directly:                       http://localhost:8080 (healthz: /healthz)
#   PostgreSQL with pgvector:           localhost:55432 (HOMYCH_DB_PORT)
#   access service mock:                http://localhost:8091 (HOMYCH_MOCK_PORT)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: homych
      POSTGRES_PASSWORD: homych
      POSTGRES_DB: homych
    ports:
      - "${HOMYCH_DB_PORT:-55432}:5432"   # host port; change with HOMYCH_DB_PORT if it is taken
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homych -d homych"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://homych:homych@db:5432/homych?sslmode=disable
      DEMO_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:-demo-only-secret-change-me}
      APP_TZ: Europe/Moscow
      SCHEDULER_INTERVAL: 10s   # how often the scheduler checks due blocks
      ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088,http://127.0.0.1:4173,http://localhost:4173
      ACCESS_SERVICE_URL: http://mock-access:8091   # the real access service replaces the mock here
      # business events (outbox): log | http (EVENTS_HTTP_URL, EVENTS_HTTP_TOKEN) | off — docs/architecture/events.md
      EVENTS_PUBLISHER: ${EVENTS_PUBLISHER:-log}
      EVENTS_HTTP_URL: ${EVENTS_HTTP_URL:-}
      EVENTS_HTTP_TOKEN: ${EVENTS_HTTP_TOKEN:-}
    ports:
      - "${HOMYCH_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mock-access:
        condition: service_started

  # demo stand-in for the access request service (OQ08): number, approval after a delay, deny / lost modes
  mock-access:
    build: ./backend
    entrypoint: ["/mock-access"]
    environment:
      HTTP_ADDR: :8091
      MOCK_APPROVE_AFTER: ${MOCK_APPROVE_AFTER:-20s}
    ports:
      - "${HOMYCH_MOCK_PORT:-8091}:8091"

  web:
    build: ./frontend
    ports:
      - "${HOMYCH_WEB_PORT:-8088}:80"
    depends_on:
      - api

volumes:
  db-data:

# Opt-in local AI stack; existing frontend/backend startup remains unchanged.
# RAG_SERVICE_TOKEN must be identical in Go and Python. MCP demo tokens are separate.
services:
  api:
    environment:
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:?Set a dedicated token with at least 24 characters}
      # answers module: Go stores questions and jobs, the worker calls the knowledge service
      RAG_URL: http://knowledge:8090
      RAG_CLIENT_TIMEOUT: ${RAG_CLIENT_TIMEOUT:-270s}   # longer than RAG_REQUEST_TIMEOUT
      # sources module: materials go to the ingestion queue with a documents:write client key
      RAG_SOURCES_TOKEN: ${RAG_SOURCES_TOKEN:-}

  knowledge:
    build: ./knowledge
    environment: &knowledge-env
      RAG_DATABASE_URL: postgresql://homych:homych@db:5432/homych
      RAG_GO_URL: http://api:8080
      # Mac: native Ollama uses the GPU (Metal) and answers several times faster than the container:
      # RAG_OLLAMA_URL=http://host.docker.internal:11434 in .env
      RAG_OLLAMA_URL: ${RAG_OLLAMA_URL:-http://ollama:11434}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:?Set a dedicated token with at least 24 characters}
      RAG_DEMO_MODE: "true"
      RAG_PROVIDER: ${RAG_PROVIDER:-ollama}
      RAG_EMBEDDING_TIMEOUT: ${RAG_EMBEDDING_TIMEOUT:-15}
      RAG_GENERATION_TIMEOUT: ${RAG_GENERATION_TIMEOUT:-45}
      RAG_REQUEST_TIMEOUT: ${RAG_REQUEST_TIMEOUT:-60}
      RAG_MCP_TOKENS: ${RAG_MCP_TOKENS:-{}}
      RAG_SYNTHETIC_SUBJECTS: ${RAG_SYNTHETIC_SUBJECTS:-[]}
      RAG_EXTERNAL_CLIENTS: ${RAG_EXTERNAL_CLIENTS:-{}}
    ports:
      - "127.0.0.1:${HOMYCH_RAG_PORT:-8090}:8090"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # indexes the lead's materials from the durable queue (one publisher, restart-safe)
  knowledge-worker:
    build: ./knowledge
    command: ["python", "-m", "homych_knowledge.worker"]
    environment: *knowledge-env
    depends_on:
      knowledge:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.13.5
    volumes:
      - ollama-data:/root/.ollama
    # CPU default; add a GPU override on a host with the appropriate runtime.

  rag-demo:
    profiles: [rag-demo]
    build: ./knowledge
    command: ["python", "-m", "homych_knowledge.demo", "--host", "0.0.0.0"]
    environment:
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:?Set a dedicated token with at least 24 characters}
      RAG_DEMO_MODE: "true"
      RAG_DEMO_API_URL: http://knowledge:8090
      RAG_DEMO_TIMEOUT: ${RAG_DEMO_TIMEOUT:-250}
      RAG_DEMO_PUBLIC_ORIGINS: '["http://127.0.0.1:${HOMYCH_DEMO_PORT:-8092}","http://localhost:${HOMYCH_DEMO_PORT:-8092}"]'
    ports:
      - "127.0.0.1:${HOMYCH_DEMO_PORT:-8092}:8092"
    depends_on:
      knowledge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  ollama-data:

<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хомыч — проверка RAG</title>
<style>
body{font:17px system-ui;background:#14131b;color:#efedf8;max-width:850px;margin:50px auto;padding:20px}
h1{font-size:32px}small,p{color:#b9b5ca}
textarea{box-sizing:border-box;width:100%;min-height:110px;background:#24212f;color:white;border:1px solid #655b83;border-radius:12px;padding:15px;font:inherit}
button{background:#b8a0ff;color:#181122;border:0;padding:13px 22px;border-radius:10px;font:inherit;cursor:pointer;margin:12px 0}
button:disabled{opacity:.5}#reply{white-space:pre-wrap;line-height:1.6}a{color:#cbb8ff}li{margin:12px 0}#state{color:#b9b5ca}
</style>
<h1>Хомыч · проверка RAG</h1>
<p>Отдельный демо-интерфейс поиска и генерации. Пользователь: {{subject}}.</p>
<label for="q">Вопрос по материалам Playbook</label>
<textarea id="q" maxlength="1000">Как в Авито устроено обучение и развитие сотрудников?</textarea>
<button id="send">Спросить</button>
<div id="state" role="status"></div><div id="reply"></div><ul id="sources"></ul>
<p><small>Это отдельный стенд, а не основной чат приложения. Сведения Playbook могут быть историческими.
Первый ответ на CPU может занять несколько минут. В deterministic-режиме ответы тестовые.</small></p>
<script>
document.getElementById('send').onclick=async()=>{
  const b=document.getElementById('send'),s=document.getElementById('state');
  const r=document.getElementById('reply'),c=document.getElementById('sources');
  b.disabled=true;r.textContent='';c.replaceChildren();s.textContent='Ищу источники и готовлю ответ…';
  try{
    const resp=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:document.getElementById('q').value})});
    const data=await resp.json();
    if(!resp.ok)throw new Error(typeof data.detail==='string'?data.detail:'Не получилось выполнить запрос');
    r.textContent=data.reply;s.textContent=`${data.status} · ${data.seconds} с · ${data.retrievalMode}`;
    for(const x of data.citations||[]){
      const parsed=new URL(x.url);if(parsed.protocol!=='https:')continue;
      const li=document.createElement('li'),a=document.createElement('a');
      a.href=parsed.href;a.textContent=x.title+' → '+x.section;
      a.target='_blank';a.rel='noopener noreferrer';li.append(a);c.append(li);
    }
  }catch(e){s.textContent=e.message}finally{b.disabled=false}
};
</script>
</html>

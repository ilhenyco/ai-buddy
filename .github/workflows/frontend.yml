name: FRONT and handoff
on:
  push:
    branches: [main, codex/frontend-handoff]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      # coverage of the logic modules (src/*.ts loaded by the tests): lines >= 90 %, branches >= 80 %
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:sites
      - name: Check specification links and contracts
        working-directory: .
        run: python3 tools/verify_team_handoff.py

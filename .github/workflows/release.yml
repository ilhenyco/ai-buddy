name: Release images
# Ready-made images for the jury and any stand: ghcr.io/<owner>/homych-{backend,web,knowledge}
# for linux/amd64 and linux/arm64, plus copies of PostgreSQL+pgvector and Ollama, so that
# docker-compose.release*.yml never needs a build or Docker Hub.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: frontend
          - name: knowledge
            context: knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homych-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=homych-${{ matrix.name }}
            org.opencontainers.image.description=Хомыч (AI-buddy), Avito Hack&Change 2026
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # third-party images copied as they are (all platforms), so the stand does not depend on Docker Hub
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy pgvector and Ollama
        run: |
          owner="ghcr.io/${{ github.repository_owner }}"
          docker buildx imagetools create -t "$owner/homych-pgvector:pg16" pgvector/pgvector:pg16
          docker buildx imagetools create -t "$owner/homych-ollama:0.13.5" ollama/ollama:0.13.5

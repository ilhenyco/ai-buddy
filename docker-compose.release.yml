# Хомыч from ready-made images (GitHub Container Registry) — no source code, no build, no Docker Hub.
#
#   curl -O https://raw.githubusercontent.com/ilhenyco/ai-buddy/main/docker-compose.release.yml
#   docker compose -f docker-compose.release.yml up
#
# Then open http://localhost:8088 and sign in as any test user. Questions to Хомыч get an honest
# "search is not connected" reply here; for AI add docker-compose.release-ai.yml (see README).
# HOMYCH_VERSION picks the image tag (default latest), e.g. HOMYCH_VERSION=v1.0.
name: homych
services:
  db:
    image: ghcr.io/ilhenyco/homych-pgvector:pg16   # copy of pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: homych
      POSTGRES_PASSWORD: homych
      POSTGRES_DB: homych
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homych -d homych"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ghcr.io/ilhenyco/homych-backend:${HOMYCH_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://homych:homych@db:5432/homych?sslmode=disable
      DEMO_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:-demo-only-secret-change-me}
      APP_TZ: Europe/Moscow
      SCHEDULER_INTERVAL: 10s
      ALLOWED_ORIGINS: http://localhost:${HOMYCH_WEB_PORT:-8088},http://127.0.0.1:${HOMYCH_WEB_PORT:-8088}
      ACCESS_SERVICE_URL: http://mock-access:8091
      FEATURES: ${FEATURES:-all}
      EVENTS_PUBLISHER: log
    ports:
      - "127.0.0.1:${HOMYCH_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mock-access:
        condition: service_started

  mock-access:
    image: ghcr.io/ilhenyco/homych-backend:${HOMYCH_VERSION:-latest}
    entrypoint: ["/mock-access"]
    environment:
      HTTP_ADDR: :8091
      MOCK_APPROVE_AFTER: 20s

  web:
    image: ghcr.io/ilhenyco/homych-web:${HOMYCH_VERSION:-latest}
    ports:
      - "${HOMYCH_WEB_PORT:-8088}:80"
    depends_on:
      - api

volumes:
  db-data:

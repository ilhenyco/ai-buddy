# One origin for the page and the API: the session cookie and CSRF checks work without CORS.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;          # the backend compares Origin with this host
    proxy_set_header X-Request-ID $request_id;
  }

  location /assets/ { try_files $uri =404; expires 1h; }
  location /fonts/  { try_files $uri =404; expires 7d; }
  location / { try_files $uri /index.html; }
}
